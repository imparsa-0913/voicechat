name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip build.zip
        run: |
          unzip build.zip -d project
          ls -la project

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        working-directory: project
        run: chmod +x gradlew || true

      - name: Build with Gradle
        working-directory: project
        run: |
          if [ -f gradlew ]; then
            ./gradlew build --stacktrace
          else
            gradle build --stacktrace
          fi

      - name: List built jars
        working-directory: project
        run: ls -la build/libs/

      - name: Find plugin jar
        id: find_jar
        working-directory: project
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "Selected JAR: $JAR"

      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVoice-Plugin
          path: project/${{ steps.find_jar.outputs.jar_path }}
          if-no-files-found: error

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-build-${{ github.run_number }}
          name: "Plugin Build #${{ github.run_number }}"
          files: project/${{ steps.find_jar.outputs.jar_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
